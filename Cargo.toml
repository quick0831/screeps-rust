[package]
name = "screeps-rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[dependencies]
screeps-game-api = "0.23"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.114"

[features]
default = []
sim = ["screeps-game-api/sim"]
mmo = ["screeps-game-api/mmo"]
